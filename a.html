<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Control</title>
<style>
    body {
        font-family: monospace;
        margin: 0;
        padding: 0;
        background-color: #343434;
        color: #ffffff;
    }
    h1 {
        text-align: center;
        color: #66fcf1;
    }
    .controls {
        display: flex;
        justify-content: space-between;
        margin: 20px;
    }
    .camera,
    .command-mode,
    .arrow-mode {
        width: 45%;
        border: 1px solid #ccc;
        padding: 10px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    textarea {
        font-family: monospace;
        width: 90%;
        border-radius: 5px;
        height: 100px;
        font-size: 16px;
        color: #ffffff;
        background-color: #36454f;
        border: none;
        padding: 10px;
        margin: 10px 0;
        box-shadow: 0 0 10px #000;
    }
    button {
        width: 200px;
        padding: 10px;
        font-size: 18px;
        background-color: #45a29e;
        color: #0b0c10;
        border: 2px solid #1f2833;
        cursor: pointer;
        transition-duration: 0.2s;
        border-radius: 5px;
        margin: 10px 0;
    }
    button:hover,
    button.active {
        background-color: #1f2833;
        color: #c5c6c7;
    }
    .arrow-buttons {
        display: grid;
        grid-template-columns: repeat(3, 60px);
        grid-template-rows: repeat(3, 60px);
        gap: 5px;
        justify-items: center;
        align-items: center;
        height: 200px;
    }
    .arrow-buttons button {
        font-size: 24px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        width: 60px;
        height: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .arrow-buttons .up { grid-column: 2; grid-row: 1; }
    .arrow-buttons .left { grid-column: 1; grid-row: 2; }
    .arrow-buttons .right { grid-column: 3; grid-row: 2; }
    .arrow-buttons .down { grid-column: 2; grid-row: 2; }

    @media (max-width: 768px) {
        .controls { flex-direction: column; align-items: center; }
        .command-mode, .arrow-mode { width: 90%; margin-bottom: 20px; }
        .arrow-buttons button { font-size: 18px; width: 50px; height: 50px; }
    }
</style>
</head>
<body>
<h1>Robot Control</h1>

<div class="controls">
    <div class="camera">
        <h2>Camera</h2>
        <img id="cam" src="https://placehold.co/600x400?text=Obraz+z+kamery" style="width:100%;max-width:480px;border-radius:10px">
    </div>
    <div class="command-mode">
        <h2>Sensor Data</h2>
        <p>Temperature: <span id="temp">Loading...</span></p>
        <p>Humidity: <span id="humidity">Loading...</span></p>
    </div>
</div>

<div class="controls">
    <div class="command-mode">
        <h2>Command Mode</h2>
        <textarea id="commands" spellcheck="false" placeholder="Enter commands here..."></textarea>
        <button onclick="sendCommands()">Send Commands</button>
        <div id="response"></div>
    </div>

    <div class="arrow-mode">
        <h2>Wheels Control</h2>
        <div class="arrow-buttons">
            <button class="up" onmousedown="startMove('fwd')" onmouseup="stopMove()">W</button>
            <button class="left" onmousedown="startMove('left')" onmouseup="stopMove()">A</button>
            <button class="right" onmousedown="startMove('right')" onmouseup="stopMove()">D</button>
            <button class="down" onmousedown="startMove('back')" onmouseup="stopMove()">S</button>
        </div>
    </div>

    <div class="arrow-mode">
        <h2>Camera Controls</h2>
        <div class="arrow-buttons">
            <button class="up" onclick="moveServo('up')">↑</button>
            <button class="left" onclick="moveServo('left')">←</button>
            <button class="right" onclick="moveServo('right')">→</button>
            <button class="down" onclick="moveServo('down')">↓</button>
        </div>
    </div>
</div>

<script>
    function sendCommands() {
        const commands = document.getElementById("commands").value;
        fetch("/control", {
            method: "POST",
            headers: {"Content-Type": "application/x-www-form-urlencoded"},
            body: "commands=" + encodeURIComponent(commands)
        })
        .then(res => res.text())
        .then(txt => document.getElementById("response").innerHTML = txt)
        .catch(() => document.getElementById("response").innerHTML = "Błąd połączenia");
    }

    function updateSensorData() {
        fetch("/sensor_data")
            .then(res => res.json())
            .then(data => {
                document.getElementById("temp").textContent = data.temperature + " °C";
                document.getElementById("humidity").textContent = data.humidity + " %";
            })
            .catch(() => {
                document.getElementById("temp").textContent = "Błąd";
                document.getElementById("humidity").textContent = "Błąd";
            });
    }
    setInterval(updateSensorData, 2000);

    function startMove(direction){ fetch("/move_" + direction,{method:"POST"}).catch(()=>{});}
    function stopMove(){ fetch("/stop",{method:"POST"}).catch(()=>{});}
    function moveServo(dir){ fetch("/servo_" + dir,{method:"POST"}).catch(()=>{});}

    let keys = { w:"fwd", a:"left", s:"back", d:"right" };
    let activeKey = null;

    document.addEventListener("keydown", e => {
        let key = e.key.toLowerCase();
        if(keys[key] && activeKey!==key){
            activeKey = key;
            startMove(keys[key]);
        }
    });
    document.addEventListener("keyup", e => {
        let key = e.key.toLowerCase();
        if(keys[key]){
            activeKey=null;
            stopMove();
        }
    });

    document.addEventListener("keydown", e=>{
        switch(e.key){
            case "ArrowUp": moveServo("up"); break;
            case "ArrowDown": moveServo("down"); break;
            case "ArrowLeft": moveServo("left"); break;
            case "ArrowRight": moveServo("right"); break;
        }
    });


</script>
</body>
</html>
